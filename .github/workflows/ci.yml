name: CI

on:
  pull_request:
  push:
    branches: [main]
  # workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Build step still disabled — node-version above is now 22, which
      # resolves the pnpm engine mismatch, but `apps/web`'s build fetches
      # from a live API at build time (e.g. the build-your-own page), and no
      # API/Postgres is running in this CI job. Re-enable once that's sorted.
      # - name: Build
      #   run: pnpm build
