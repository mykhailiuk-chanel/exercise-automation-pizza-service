name: CI

on:
  pull_request:
  push:
    branches: [main]
  # workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Build step disabled for now — even with this commented out, Install
      # (the step above) already runs `pnpm install`, and pnpm itself refuses
      # to execute under Node 20 (packageManager: "pnpm@11.22.0" requires
      # Node >= 22 to even run) — so this alone is not expected to make CI
      # pass. Real fix (bump node-version above to 22, or pin an
      # older/compatible pnpm) deferred until after the Phase 8 deploy — see
      # NEXT_STEPS.md / IMPLEMENTATION_PLAN.md.
